name: midman-v1
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: midman
      POSTGRES_PASSWORD: midman
      POSTGRES_DB: midman
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U midman"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-14Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
volumes:
  pgdata:
  miniodata:
